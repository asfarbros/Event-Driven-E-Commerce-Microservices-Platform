# OrderFlow storefront — static SPA served by nginx (unprivileged image, listens on 8080).
#   - SPA fallback: every unknown path serves index.html so React Router owns the URL
#   - hashed assets under /assets/ are immutable → cache for a year
#   - index.html is never cached, so a new deploy is picked up immediately
#   - the same security headers the API Gateway sets (no framing, no sniffing)
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx: add_header inside a location REPLACES the server-level set, so the security headers are
    # repeated (included) in every location that sets its own Cache-Control.
    include /etc/nginx/conf.d/security-headers.inc;

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
