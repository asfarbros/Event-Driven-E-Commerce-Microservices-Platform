# OrderFlow — Prometheus scrape configuration (Step 8).
# Targets are the Compose service names on the internal network; the ports
# are the *_PORT values from .env (defaults shown — change both if you change one).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Node services: prom-client on GET /metrics
  - job_name: api-gateway
    static_configs: [{ targets: ["api-gateway:4000"] }]
  - job_name: catalog
    static_configs: [{ targets: ["catalog:4001"] }]
  - job_name: cart
    static_configs: [{ targets: ["cart:4002"] }]
  - job_name: notification
    static_configs: [{ targets: ["notification:4003"] }]

  # Spring Boot services: Micrometer on GET /actuator/prometheus
  - job_name: order
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["order:8081"] }]
  - job_name: inventory
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["inventory:8082"] }]
  - job_name: payment
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["payment:8083"] }]

  # RabbitMQ's built-in prometheus plugin (queue depth, consumers, acks …)
  - job_name: rabbitmq
    static_configs: [{ targets: ["rabbitmq:15692"] }]
  # Per-queue depth needs the "detailed" endpoint (the default one aggregates across queues)
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs: [{ targets: ["rabbitmq:15692"] }]
