# =============================================================================
# OrderFlow — backing infrastructure (Step 0)
# =============================================================================
# Run from the PROJECT ROOT (the folder that holds .env):
#
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
#   docker compose --env-file .env -f infra/docker-compose.yml ps
#   docker compose --env-file .env -f infra/docker-compose.yml down        # keep data
#   docker compose --env-file .env -f infra/docker-compose.yml down -v     # wipe data
#
# Conventions
# * Every credential / port comes from the root .env. ${VAR:?} makes Compose
#   refuse to start with a clear error if a variable is missing — nothing here
#   silently falls back to a hardcoded default.
# * Image tags are pinned to exact versions. Never :latest.
# * Every stateful container has a named volume and a healthcheck, so later
#   steps can use `depends_on: condition: service_healthy`.
# * All containers share one bridge network and resolve each other by service
#   name (postgres, mongodb, redis, kafka, rabbitmq, mailpit). Application services are
#   NOT containerised in this step; they run on the host and reach the
#   infrastructure through the published localhost ports.
# =============================================================================

name: orderflow

# Shared settings applied to every container.
x-defaults: &defaults
  restart: unless-stopped
  networks:
    - orderflow
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

networks:
  orderflow:
    # Explicit name so app containers (later steps) can join it with `external: true`.
    name: ${DOCKER_NETWORK:?DOCKER_NETWORK is required}
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  kafka-data:
  rabbitmq-data:

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — ONE container, THREE isolated databases (Order / Inventory / Payment)
  # ---------------------------------------------------------------------------
  # The init script in ./postgres/init creates each database with its own owner
  # role and revokes CONNECT from PUBLIC, so a service physically cannot open
  # another service's database. It runs only on first start (empty volume).
  postgres:
    <<: *defaults
    image: postgres:16.9-alpine
    container_name: orderflow-postgres
    environment:
      TZ: ${TZ:-UTC}
      # Superuser — consumed only by the init script.
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?POSTGRES_SUPERUSER is required}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      # Per-service databases + roles, read by ./postgres/init/01-create-databases.sh
      ORDER_DB_NAME: ${ORDER_DB_NAME:?ORDER_DB_NAME is required}
      ORDER_DB_USER: ${ORDER_DB_USER:?ORDER_DB_USER is required}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD is required}
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME:?INVENTORY_DB_NAME is required}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER:?INVENTORY_DB_USER is required}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?INVENTORY_DB_PASSWORD is required}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:?PAYMENT_DB_NAME is required}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:?PAYMENT_DB_USER is required}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP: the temporary init-time server only listens on a
      # unix socket, so the check stays red until the real server (and the init
      # script) have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # MongoDB — Catalog (catalog_db) and Cart (cart_db)
  # ---------------------------------------------------------------------------
  # Only the root user is created here. catalog_db and cart_db are NOT
  # pre-created: MongoDB creates a database on the first write, so each
  # service brings its own database into existence when it first stores data.
  mongodb:
    <<: *defaults
    image: mongo:7.0.16
    container_name: orderflow-mongodb
    environment:
      TZ: ${TZ:-UTC}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    ports:
      - "${MONGO_PORT:?MONGO_PORT is required}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # `ping` is allowed without authentication, so no credentials are needed here.
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Redis — Cart Service cache (password-protected, AOF persistence)
  # ---------------------------------------------------------------------------
  redis:
    <<: *defaults
    image: redis:7.4.2-alpine
    container_name: orderflow-redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
    environment:
      TZ: ${TZ:-UTC}
      # redis-cli reads its password from here, so the healthcheck needs no -a flag.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "${REDIS_PORT:?REDIS_PORT is required}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Kafka — single broker, KRaft mode (no ZooKeeper), DUAL listeners
  # ---------------------------------------------------------------------------
  # Why two listeners: a Kafka client first connects to a bootstrap address and
  # is then told, by the broker, which address to use from now on (the
  # "advertised" listener). One address cannot be right for both worlds:
  #   * INTERNAL  kafka:29092      -> other containers on the orderflow network
  #   * EXTERNAL  localhost:9092   -> services running on the host (this step)
  # Later, when the services are containerised, they simply switch
  # KAFKA_BOOTSTRAP_SERVERS to kafka:29092 — no broker change needed.
  # Topic auto-creation is OFF; topics are created explicitly in a later step.
  kafka:
    <<: *defaults
    image: apache/kafka:3.9.1
    container_name: orderflow-kafka
    hostname: kafka
    environment:
      TZ: ${TZ:-UTC}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID is required}
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:-}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:${KAFKA_CONTROLLER_PORT:?KAFKA_CONTROLLER_PORT is required}
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:${KAFKA_INTERNAL_PORT:?KAFKA_INTERNAL_PORT is required},EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT:?KAFKA_EXTERNAL_PORT is required},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT:?}
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:${KAFKA_INTERNAL_PORT:?},EXTERNAL://${KAFKA_EXTERNAL_HOST:?KAFKA_EXTERNAL_HOST is required}:${KAFKA_EXTERNAL_PORT:?}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Single-broker settings: internal topics cannot replicate to brokers that don't exist.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      # The EXTERNAL listener must use the SAME port inside and outside the
      # container, because that port is what the broker advertises to host clients.
      - "${KAFKA_EXTERNAL_PORT:?}:${KAFKA_EXTERNAL_PORT:?}"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Real readiness check (asks the broker for its API versions), with a small
      # heap so the probe JVM stays cheap.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xmx128m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:${KAFKA_INTERNAL_PORT:?} > /dev/null 2>&1"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 40s

  # ---------------------------------------------------------------------------
  # RabbitMQ — notification task queue (retry + dead-letter), with management UI
  # ---------------------------------------------------------------------------
  rabbitmq:
    <<: *defaults
    image: rabbitmq:3.13.7-management-alpine
    container_name: orderflow-rabbitmq
    # RabbitMQ stores data under its node name (rabbit@<hostname>). A fixed
    # hostname keeps the node name stable across restarts so the volume is reused.
    hostname: rabbitmq
    environment:
      TZ: ${TZ:-UTC}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:?RABBITMQ_VHOST is required}
    ports:
      - "${RABBITMQ_PORT:?RABBITMQ_PORT is required}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:?RABBITMQ_MANAGEMENT_PORT is required}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Mailpit — SMTP test inbox for the Notification Worker (Step 7)
  # ---------------------------------------------------------------------------
  # Accepts any mail on SMTP (no auth, no TLS) and shows it in a web inbox, so
  # NOTIFICATION_CHANNEL=smtp can be demonstrated with no real provider.
  # Messages are kept in memory only — nothing to persist.
  mailpit:
    <<: *defaults
    image: axllent/mailpit:v1.27.0
    container_name: orderflow-mailpit
    environment:
      TZ: ${TZ:-UTC}
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "500"
    ports:
      - "${MAILPIT_SMTP_PORT:?MAILPIT_SMTP_PORT is required}:1025"
      - "${MAILPIT_UI_PORT:?MAILPIT_UI_PORT is required}:8025"
    healthcheck:
      # Mailpit's own readiness probe (hits its /readyz endpoint).
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # Management UIs — stateless, for browsing / demo recordings
  # ===========================================================================

  # Browse Kafka topics, partitions, consumer groups and messages.
  kafka-ui:
    <<: *defaults
    image: ghcr.io/kafbat/kafka-ui:v1.1.0
    container_name: orderflow-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_UI_CLUSTER_NAME:?KAFKA_UI_CLUSTER_NAME is required}
      # Talks to the broker over the INTERNAL listener (container-to-container).
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:${KAFKA_INTERNAL_PORT:?}
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: -Xms128m -Xmx512m
    ports:
      - "${KAFKA_UI_PORT:?KAFKA_UI_PORT is required}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  # Browse MongoDB databases and collections (catalog_db / cart_db once they exist).
  mongo-express:
    <<: *defaults
    image: mongo-express:1.0.2-20
    container_name: orderflow-mongo-express
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:?}:${MONGO_ROOT_PASSWORD:?}@mongodb:27017/?authSource=admin
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      # Browser login (basic auth) — separate from the MongoDB credentials.
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:?MONGO_EXPRESS_USER is required}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:?MONGO_EXPRESS_PASSWORD is required}
    ports:
      - "${MONGO_EXPRESS_PORT:?MONGO_EXPRESS_PORT is required}:8081"
    healthcheck:
      # 401 (auth required) still means the server is up; only 5xx / no answer is unhealthy.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8081/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Browse Redis keys (the Cart Service cache).
  redis-commander:
    <<: *defaults
    image: ghcr.io/joeferner/redis-commander:0.8.1
    container_name: orderflow-redis-commander
    depends_on:
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      # Browser login (basic auth) — separate from the Redis password.
      HTTP_USER: ${REDIS_COMMANDER_USER:?REDIS_COMMANDER_USER is required}
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASSWORD:?REDIS_COMMANDER_PASSWORD is required}
    ports:
      - "${REDIS_COMMANDER_PORT:?REDIS_COMMANDER_PORT is required}:8081"
    healthcheck:
      # Same probe the image ships with, on a shorter interval.
      test: ["CMD", "/redis-commander/bin/healthcheck.js"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
