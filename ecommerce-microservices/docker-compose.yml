version: "3.9"

services:
  # ───────────────────────────────────────────────
  # PostgreSQL – Relational database
  # ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ecom-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ecom_user
      POSTGRES_PASSWORD: ecom_pass
      POSTGRES_DB: ecom_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecom-network

  # ───────────────────────────────────────────────
  # MongoDB – Document database
  # ───────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: ecom-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ecom_user
      MONGO_INITDB_ROOT_PASSWORD: ecom_pass
      MONGO_INITDB_DATABASE: ecom_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecom-network

  # ───────────────────────────────────────────────
  # Redis – In-memory cache / message broker
  # ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ecom_pass
    volumes:
      - redis_data:/data
    networks:
      - ecom-network

  # ───────────────────────────────────────────────
  # Kafka (KRaft mode – no Zookeeper required)
  # ───────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    container_name: ecom-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # KRaft mode configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - ecom-network

  # ───────────────────────────────────────────────
  # RabbitMQ – Message broker (with management UI)
  # ───────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ecom-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ecom_user
      RABBITMQ_DEFAULT_PASS: ecom_pass
      RABBITMQ_DEFAULT_VHOST: ecom_vhost
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecom-network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  kafka_data:
  rabbitmq_data:

networks:
  ecom-network:
    driver: bridge
